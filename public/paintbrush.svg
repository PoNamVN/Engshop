<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Shadow/outline for contrast on any background -->
  <g transform="rotate(-45, 24, 24)" opacity="0.6">
    <!-- Handle outline -->
    <rect x="20.5" y="1.5" width="8" height="26" rx="3" fill="black" opacity="0.5"/>
    <!-- Ferrule outline -->
    <rect x="19.5" y="25.5" width="10" height="6" rx="1" fill="black" opacity="0.5"/>
    <!-- Bristles outline -->
    <ellipse cx="24.5" cy="38.5" rx="6" ry="8.5" fill="black" opacity="0.5"/>
  </g>

  <g transform="rotate(-45, 24, 24)">
    <!-- Wooden handle -->
    <rect x="20" y="1" width="8" height="26" rx="3" fill="#c8922a"/>
    <rect x="21" y="2" width="3" height="24" rx="1.5" fill="#e8b84b" opacity="0.7"/>

    <!-- Ferrule (metal band) -->
    <rect x="19" y="25" width="10" height="6" rx="1.5" fill="#b0b8c8"/>
    <rect x="19" y="26.5" width="10" height="1.5" fill="white" opacity="0.35"/>
    <rect x="19" y="29" width="10" height="1" fill="black" opacity="0.2"/>

    <!-- Bristles body -->
    <ellipse cx="24" cy="38" rx="5.5" ry="8" fill="#e05c2a"/>
    <!-- Bristle highlight -->
    <ellipse cx="22.5" cy="36" rx="2" ry="5" fill="#f08050" opacity="0.6"/>

    <!-- Bristle tip (bright paint) -->
    <ellipse cx="24" cy="44.5" rx="2.5" ry="2" fill="#ff8040"/>
    <ellipse cx="23.5" cy="44" rx="1" ry="1.2" fill="white" opacity="0.5"/>

    <!-- Paint drip at tip -->
    <circle cx="24" cy="46.5" r="1" fill="#ff6622" opacity="0.8"/>
  </g>
</svg>
